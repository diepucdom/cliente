<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2 - Ordenadores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body class="bg-dark text-light">

    <div class="container py-5">

        <!-- CABECERA -->
        <header class="bg-black border-bottom border-secondary rounded-3 p-4 mb-5 shadow">
            <h1 class="fw-bold text-light mb-2">Práctica 2 - Ordenadores</h1>
            <p class="text-secondary mb-0">Sistema de gestión de equipos informáticos</p>
        </header>

        <!-- FORMULARIOS -->
        <div class="row g-4">

            <!-- ORDENADOR -->
            <div class="col-lg-6">
                <div class="card bg-black text-light border border-secondary shadow h-100">

                    <div class="card-header bg-secondary bg-opacity-25 border-secondary py-3">
                        <h2 class="h5 fw-bold mb-0 text-light">Crear ordenador</h2>
                    </div>

                    <div class="card-body p-4">

                        <label class="form-label text-secondary">Marca:</label>
                        <input type="text" id="marca" class="form-control bg-dark text-light border-secondary mb-3">

                        <label class="form-label text-secondary">Modelo:</label>
                        <input type="text" id="modelo" class="form-control bg-dark text-light border-secondary mb-4">

                        <label class="form-label text-secondary">Memoria RAM (GB):</label>
                        <input type="number" id="ram" class="form-control bg-dark text-light border-secondary mb-3">

                        <label class="form-label text-secondary">Disco duro (GB):</label>
                        <input type="number" id="disco" class="form-control bg-dark text-light border-secondary mb-3">

                        <label class="form-label text-secondary">Pulgadas:</label>
                        <input type="number" id="pulgadas" class="form-control bg-dark text-light border-secondary mb-4">

                        <button id="crearOrdenador" class="btn btn-secondary w-100 fw-semibold">
                            Crear ordenador
                        </button>

                    </div>
                </div>
            </div>

            <!-- PORTÁTIL -->
            <div class="col-lg-6">
                <div class="card bg-black text-light border border-secondary shadow h-100">

                    <div class="card-header bg-secondary bg-opacity-25 border-secondary py-3">
                        <h2 class="h5 fw-bold mb-0 text-light">Crear portátil</h2>
                    </div>

                    <div class="card-body p-4">

                        <label class="form-label text-secondary">Marca:</label>
                        <input type="text" id="marcaPortatil" class="form-control bg-dark text-light border-secondary mb-3">

                        <label class="form-label text-secondary">Modelo:</label>
                        <input type="text" id="modeloPortatil" class="form-control bg-dark text-light border-secondary mb-4">

                        <label class="form-label text-secondary">Autonomía (horas):</label>
                        <input type="number" id="autonomia" class="form-control bg-dark text-light border-secondary mb-4">

                        <button id="crearPortatil" class="btn btn-secondary w-100 fw-semibold">
                            Crear portátil
                        </button>

                    </div>
                </div>
            </div>

        </div>

        <hr class="border-secondary my-5">

        <!-- MOSTRAR INFORMACIÓN -->
        <section>
            <h2 class="h4 fw-bold mb-4">Mostrar información</h2>

            <div class="row g-3">
                <div class="col-md-6">
                    <button id="mostrarOrdenador" class="btn btn-outline-light w-100 py-2">
                        Mostrar ordenador
                    </button>
                </div>

                <div class="col-md-6">
                    <button id="mostrarPortatil" class="btn btn-outline-light w-100 py-2">
                        Mostrar portátil
                    </button>
                </div>
            </div>
        </section>

        <hr class="border-secondary my-5">

        <!-- RESULTADOS -->
        <section>
            <h2 class="h4 fw-bold mb-4">Resultados</h2>

            <div class="row g-4">

                <div class="col-md-6">
                    <div class="card bg-black text-light border border-secondary shadow h-100">
                        <div class="card-body">
                            <div id="resultadoOrdenador"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card bg-black text-light border border-secondary shadow h-100">
                        <div class="card-body">
                            <div id="resultadoPortatil"></div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </div>

</body>
</html>
